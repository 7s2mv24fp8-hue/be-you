# Render Blueprint Specification for BeYou Studio Web DAW
# Documentation: https://render.com/docs/blueprint-spec
#
# IMPORTANT: Before deploying, set these secret env vars in the Render Dashboard:
#   ADMIN_PASSWORD  — a strong password for the rahul admin account
#   HF_TOKEN        — (optional) your Hugging Face API token for AI music gen

services:
  - type: web
    name: beyou-studio
    runtime: python
    region: oregon
    plan: free
    branch: master
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: rahul
      - key: ADMIN_EMAIL
        value: rahul@beyoustudio.app
      - key: ADMIN_PASSWORD
        sync: false   # ← Set this secret in the Render dashboard — DO NOT hardcode here
      - key: ADMIN_FULL_NAME
        value: Rahul Sharma
      - key: HF_TOKEN
        sync: false
